<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Deptos Scraper{% endblock %}</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    body { background: #0f1117; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
    .navbar { background: #1a1d27 !important; border-bottom: 1px solid #2d3148; }
    .navbar-brand { color: #7c8cf8 !important; font-weight: 700; letter-spacing: 1px; }
    .nav-link { color: #b0b7d4 !important; }
    .nav-link.active, .nav-link:hover { color: #7c8cf8 !important; }
    .sidebar { background: #1a1d27; border-right: 1px solid #2d3148; min-height: calc(100vh - 56px); padding: 1rem; }
    .card { background: #1a1d27; border: 1px solid #2d3148; }
    .card-header { background: #1e2235; border-bottom: 1px solid #2d3148; }
    .form-control, .form-select { background: #0f1117; border-color: #2d3148; color: #e0e0e0; }
    .form-control:focus, .form-select:focus { background: #0f1117; color: #e0e0e0; border-color: #7c8cf8; box-shadow: 0 0 0 0.2rem rgba(124,140,248,.15); }
    .btn-primary { background: #7c8cf8; border-color: #7c8cf8; }
    .btn-primary:hover { background: #6370e0; border-color: #6370e0; }
    .badge-score { font-size: .75rem; padding: .3em .6em; border-radius: 4px; }
    .score-high { background: #1e7e34; color: #fff; }
    .score-mid  { background: #6c4c00; color: #fff; }
    .score-low  { background: #7b1f1f; color: #fff; }
    label { color: #b0b7d4; font-size: .85rem; }
    .card-header, .card-body, .card-title, .card-text { color: #e0e0e0; }
    .card-header strong { color: #e0e0e0; }
    .form-check-label { color: #b0b7d4; }
    .form-label { color: #b0b7d4; }
    .text-secondary { color: #6c7293 !important; }
    .table { color: #e0e0e0; }
    .table th { color: #e0e0e0; }
    .table td { color: #e0e0e0; }
    h1, h2, h3, h4, h5, h6 { color: #e0e0e0; }
    p { color: #c0c4d4; }
    /* Bootstrap overrides: contraste en tema oscuro */
    .navbar-toggler { border-color: #2d3148; }
    .navbar-toggler-icon { filter: invert(1); }
    .btn-outline-secondary { color: #b0b7d4; border-color: #2d3148; }
    .btn-outline-secondary:hover { color: #e0e0e0; background-color: #2d3148; border-color: #4a5080; }
    .btn-outline-primary { color: #7c8cf8; border-color: #7c8cf8; }
    .btn-outline-primary:hover { color: #fff; background-color: #7c8cf8; border-color: #7c8cf8; }
    .badge.bg-secondary { background-color: #2d3148 !important; color: #e0e0e0; }
    .text-muted { color: #6c7293 !important; }
    .dropdown-menu { background: #1a1d27; border-color: #2d3148; }
    .dropdown-item { color: #e0e0e0; }
    .dropdown-item:hover { background: #2d3148; color: #fff; }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="/map"><i class="bi bi-building"></i> Deptos</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link {% if active_page == 'map' %}active{% endif %}" href="/map"><i class="bi bi-map"></i> Mapa</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'ranking' %}active{% endif %}" href="/ranking"><i class="bi bi-list-ol"></i> Ranking</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'stats' %}active{% endif %}" href="/stats"><i class="bi bi-bar-chart"></i> Estadísticas</a></li>
          <li class="nav-item"><a class="nav-link {% if active_page == 'mi-perfil' %}active{% endif %}" href="/mi-perfil"><i class="bi bi-sliders"></i> Mi Perfil</a></li>
          {% if user.is_admin %}
          <li class="nav-item"><a class="nav-link {% if active_page == 'scraping' %}active{% endif %}" href="/admin/scraping"><i class="bi bi-robot"></i> Scraping</a></li>
          {% endif %}
        </ul>
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <span class="nav-link text-secondary"><i class="bi bi-person-circle"></i> {{ user.username }}</span>
          </li>
          <li class="nav-item">
            <form action="/auth/logout" method="post" class="d-inline">
              <button type="submit" class="btn btn-sm btn-outline-secondary ms-2">Salir</button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
