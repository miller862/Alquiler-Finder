<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Deptos Scraper</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body { background: #0f1117; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 380px; }
    .login-title { color: #7c8cf8; font-weight: 700; font-size: 1.6rem; margin-bottom: .3rem; }
    .login-subtitle { color: #6c7293; font-size: .9rem; margin-bottom: 2rem; }
    .form-control { background: #0f1117; border-color: #2d3148; color: #e0e0e0; }
    .form-control:focus { background: #0f1117; color: #e0e0e0; border-color: #7c8cf8; box-shadow: 0 0 0 0.2rem rgba(124,140,248,.15); }
    .btn-login { background: #7c8cf8; border: none; width: 100%; padding: .65rem; font-weight: 600; font-size: 1rem; }
    .btn-login:hover { background: #6370e0; }
    label { color: #b0b7d4; font-size: .85rem; }
    .alert-error { background: #3b1a1a; border: 1px solid #7b3030; color: #ff8080; border-radius: 8px; padding: .75rem 1rem; margin-bottom: 1rem; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-title">🏠 Deptos Scraper</div>
    <div class="login-subtitle">Buscador inteligente de departamentos en CABA</div>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form action="/auth/login" method="post">
      <div class="mb-3">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" class="form-control mt-1" placeholder="tu_usuario" required autofocus />
      </div>
      <div class="mb-4">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control mt-1" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-login text-white">Ingresar</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
